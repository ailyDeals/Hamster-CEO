<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hamster CEO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --gold:#f59e0b;--gold2:#fbbf24;--gold3:#fde68a;
  --bg:#0a0b0f;--surf:#13141a;--surf2:#1a1b24;--border:#22253a;
  --text:#e8eaf0;--sub:#6b7280;--green:#22c55e;--red:#ef4444;
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overscroll-behavior:none;
  overflow-x:hidden;
}
/* Loading */
#ls{
  position:fixed;inset:0;z-index:999;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
.ls-ham{font-size:72px;animation:bounce 1s infinite alternate}
@keyframes bounce{to{transform:translateY(-18px)}}
.ls-bar{width:160px;height:5px;background:#1e2030;border-radius:3px;overflow:hidden}
.ls-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:fill 2s ease forwards}
@keyframes fill{from{width:0}to{width:100%}}
.ls-txt{font-size:12px;color:var(--sub);letter-spacing:.1em}

/* App */
#app{display:none;max-width:430px;margin:0 auto;padding-bottom:72px}

/* Header */
.hdr{
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);
  position:sticky;top:0;z-index:40;
  border-bottom:1px solid var(--border);
}
.hdr-left{display:flex;align-items:center;gap:10px}
.avatar{
  width:44px;height:44px;border-radius:50%;
  background:var(--surf2);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;overflow:hidden;flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.uname{font-size:14px;font-weight:700;line-height:1.2}
.ulg{font-size:11px;color:var(--gold);line-height:1.3}
.hdr-right{text-align:right}
.pph-lbl{font-size:10px;color:var(--sub)}
.pph-val{font-size:13px;font-weight:700;color:var(--green)}

/* Balance */
.balance{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 0 10px;
}
.balance .coin-ico{font-size:34px}
.balance .amount{font-size:42px;font-weight:900;letter-spacing:-.03em;color:#fff}

/* Daily row */
.daily-row{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
  padding:0 14px 12px;
}
.daily-btn{
  background:var(--surf);border:1px solid var(--border);
  border-radius:14px;padding:10px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;transition:transform .1s,border-color .15s;
  font-family:inherit;color:var(--text);
}
.daily-btn:active{transform:scale(.95)}
.daily-btn .d-ico{font-size:22px}
.daily-btn .d-lbl{font-size:10px;color:var(--sub);text-align:center;line-height:1.3}
.daily-btn .d-badge{font-size:10px;font-weight:700;color:var(--gold)}

/* TAB PAGES */
.page{display:none;padding:14px}
.page.active{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Home / Tap */
.ham-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 16px}
.ham-btn{
  width:220px;height:220px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:90px;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 55%,#b45309 100%);
  box-shadow:0 0 0 0 rgba(245,158,11,.4);
  animation:pulseGlow 2.5s ease-in-out infinite;
  position:relative;overflow:visible;
  transition:transform .08s;touch-action:manipulation;
  user-select:none;
}
.ham-btn:active{transform:scale(.92)}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4),0 12px 40px rgba(245,158,11,.25)}
  50%{box-shadow:0 0 0 20px rgba(245,158,11,0),0 12px 40px rgba(245,158,11,.35)}
}
#float-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:900}
.fp{
  position:absolute;font-size:26px;font-weight:900;color:var(--gold2);
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  animation:floatUp .75s ease forwards;
  pointer-events:none;
}
@keyframes floatUp{
  0%{transform:translateY(0) scale(.7);opacity:0}
  20%{transform:translateY(-10px) scale(1.2);opacity:1}
  100%{transform:translateY(-80px) scale(1);opacity:0}
}

/* Energy */
.energy-wrap{padding:0 14px}
.e-row{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:5px}
.e-bar{height:12px;background:var(--surf2);border-radius:6px;overflow:hidden}
.e-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3));transition:width .3s ease;border-radius:6px}
.boost-row{display:flex;gap:8px;margin-top:10px}
.boost-btn{
  flex:1;background:var(--surf);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:600;cursor:pointer;
  color:var(--text);font-family:inherit;
  transition:transform .1s,border-color .15s;
}
.boost-btn:active{transform:scale(.96)}
.boost-btn:disabled{opacity:.35;cursor:not-allowed}
.boost-btn i{color:var(--gold)}

/* Offline earnings popup */
.offline-popup{
  background:linear-gradient(135deg,var(--surf),#1e2038);
  border:1px solid var(--gold);border-radius:16px;padding:18px;margin:0 14px 14px;
  display:flex;align-items:center;gap:12px;
  animation:fadeUp .3s ease;
}
.offline-popup .op-ico{font-size:32px}
.offline-popup .op-txt{flex:1;font-size:12px;color:var(--sub);line-height:1.5}
.offline-popup .op-amt{font-size:16px;font-weight:800;color:var(--gold)}
.offline-popup .op-close{
  background:var(--gold);color:#000;border:none;border-radius:8px;
  padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;
}

/* Upgrades */
.cat-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{
  padding:7px 14px;border-radius:20px;font-size:11px;font-weight:600;
  white-space:nowrap;cursor:pointer;border:1px solid var(--border);
  background:var(--surf);color:var(--sub);
  transition:all .15s;font-family:inherit;
}
.cat-pill.active{background:var(--gold);color:#000;border-color:var(--gold)}
.up-card{
  background:var(--surf);border:1px solid var(--border);border-radius:14px;
  padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
  transition:border-color .15s;
}
.up-card:hover{border-color:rgba(245,158,11,.3)}
.up-ico{font-size:32px;width:42px;text-align:center;flex-shrink:0}
.up-info{flex:1;min-width:0}
.up-name{font-size:13px;font-weight:600;line-height:1.3}
.up-meta{font-size:10px;color:var(--sub);margin-top:2px}
.up-effect{font-size:10px;color:var(--green);margin-top:1px}
.buy-btn{
  background:var(--gold);color:#000;border:none;border-radius:10px;
  padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;
  white-space:nowrap;flex-shrink:0;font-family:inherit;
  transition:transform .1s,opacity .15s;
}
.buy-btn:active{transform:scale(.95)}
.buy-btn:disabled{opacity:.3;cursor:not-allowed;background:var(--sub)}

/* Section title */
.sec-title{font-size:16px;font-weight:700;margin-bottom:12px}

/* Tasks */
.task-card{
  background:var(--surf);border:1px solid var(--border);border-radius:14px;
  padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.task-ico{font-size:28px;width:40px;text-align:center;flex-shrink:0}
.task-info{flex:1;min-width:0}
.task-title{font-size:13px;font-weight:500;line-height:1.3}
.task-reward{font-size:11px;color:var(--gold);margin-top:2px;font-weight:600}
.go-btn{
  background:var(--gold);color:#000;border:none;border-radius:10px;
  padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer;
  flex-shrink:0;font-family:inherit;transition:transform .1s,opacity .15s;
}
.go-btn:active{transform:scale(.95)}
.go-btn.done{background:var(--surf2);color:var(--sub);cursor:not-allowed}

/* Leaderboard */
.lb-row{
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:7px;
}
.lb-row.me{border-color:var(--gold);background:rgba(245,158,11,.05)}
.lb-rank{width:24px;font-size:13px;font-weight:700;text-align:center;flex-shrink:0}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:10px;color:var(--sub);margin-top:1px}
.lb-coins{font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap}

/* Frens */
.ref-box{
  background:var(--surf);border:1px solid var(--border);border-radius:16px;
  padding:18px;margin-bottom:14px;text-align:center;
}
.ref-box .r-lbl{font-size:12px;color:var(--sub);margin-bottom:6px}
.ref-box .r-amt{font-size:28px;font-weight:900;color:var(--gold);margin-bottom:14px}
.ref-share{
  width:100%;background:var(--gold);color:#000;border:none;
  border-radius:12px;padding:13px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-bottom:8px;transition:opacity .15s;
}
.ref-share:active{opacity:.8}
.ref-copy{
  width:100%;background:var(--surf2);color:var(--text);
  border:1px solid var(--border);border-radius:12px;padding:10px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;
}
.ref-copy:active{opacity:.7}
.fren-row{
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:7px;
}
.fren-name{font-size:13px;font-weight:600}
.fren-coins{font-size:12px;color:var(--gold);font-weight:700}

/* Achievements */
.ach-card{
  background:var(--surf);border:1px solid var(--border);border-radius:16px;
  padding:14px;display:flex;gap:12px;margin-bottom:10px;
  transition:border-color .15s;
}
.ach-card.done{border-color:var(--green)}
.ach-card.locked{opacity:.6}
.ach-ico{font-size:38px;flex-shrink:0;width:44px;text-align:center}
.ach-body{flex:1;min-width:0}
.ach-name{font-size:14px;font-weight:700}
.ach-desc{font-size:11px;color:var(--sub);margin-top:2px}
.ach-prog{height:8px;background:var(--surf2);border-radius:4px;overflow:hidden;margin-top:8px}
.ach-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .3s}
.ach-pct{font-size:10px;color:var(--sub);text-align:right;margin-top:3px}
.ach-right{text-align:right;flex-shrink:0}
.ach-reward{font-size:13px;font-weight:700;color:var(--green)}
.ach-done-ico{font-size:22px;margin-top:4px}

/* Bottom nav */
#bnav{
  position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
  background:var(--surf);border-top:1px solid var(--border);
  display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px 8px;font-size:9px;color:var(--sub);
  border:none;background:none;cursor:pointer;transition:color .15s;
  font-family:inherit;
}
.nav-btn i{font-size:18px}
.nav-btn.active{color:var(--gold)}

/* Modal */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:800;
  background:rgba(0,0,0,.75);backdrop-filter:blur(5px);
  align-items:flex-end;justify-content:center;
  padding:0;
}
.modal-bg.open{display:flex}
.modal-box{
  background:var(--surf);border:1px solid var(--border);
  border-top-left-radius:22px;border-top-right-radius:22px;
  padding:22px 20px 32px;width:100%;max-height:88vh;
  overflow-y:auto;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:40px;height:4px;background:var(--surf2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.modal-body{font-size:14px;color:var(--sub);line-height:1.6;margin-bottom:18px}
.modal-ok{
  width:100%;background:var(--gold);color:#000;border:none;border-radius:12px;
  padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:opacity .15s;
}
.modal-ok:active{opacity:.8}
.modal-ok2{
  width:100%;background:var(--surf2);color:var(--text);border:1px solid var(--border);
  border-radius:12px;padding:11px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;margin-top:8px;transition:opacity .15s;
}
.modal-ok2:active{opacity:.7}

/* Check-in grid */
.ci-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.ci-item{
  background:var(--surf2);border:1px solid var(--border);border-radius:10px;
  padding:8px 4px;text-align:center;
}
.ci-item.active{border-color:var(--gold);background:rgba(245,158,11,.08)}
.ci-item.claimed{border-color:var(--green);background:rgba(34,197,94,.06)}
.ci-day{font-size:9px;color:var(--sub);margin-bottom:3px}
.ci-ico{font-size:18px;margin-bottom:2px}
.ci-amt{font-size:9px;font-weight:700;color:var(--gold)}

/* Cipher input */
.cipher-input{
  width:100%;background:var(--bg);border:2px solid var(--border);
  border-radius:12px;color:var(--text);padding:13px;
  font-family:inherit;font-size:16px;letter-spacing:.15em;
  text-align:center;text-transform:uppercase;outline:none;
  transition:border-color .15s;margin-bottom:6px;
}
.cipher-input:focus{border-color:var(--gold)}
.cipher-err{font-size:12px;color:var(--red);text-align:center;margin-bottom:10px;display:none}
.cipher-hint{
  font-size:12px;color:var(--sub);text-align:center;
  background:var(--surf2);border-radius:10px;padding:10px;margin-bottom:14px;
}

/* Combo cards */
.combo-cards{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.combo-item{
  background:var(--surf2);border:1px solid var(--border);border-radius:12px;
  padding:12px;display:flex;align-items:center;gap:10px;
}
.combo-item.done{border-color:var(--green);background:rgba(34,197,94,.05)}
.combo-ico{font-size:24px;width:32px;text-align:center}
.combo-name{flex:1;font-size:13px;font-weight:500}
.combo-check{font-size:20px}

/* Toast */
#toasts{position:fixed;bottom:80px;left:0;right:0;max-width:430px;margin:0 auto;padding:0 14px;z-index:700;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{
  background:var(--surf);border:1px solid var(--border);border-radius:12px;
  padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  animation:toastIn .2s ease;min-width:200px;
}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.success{border-left:3px solid var(--green)}
.toast.error{border-left:3px solid var(--red)}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.empty .e-ico{font-size:40px;margin-bottom:10px}
.empty p{font-size:13px}

/* Utility */
.flex-jb{display:flex;justify-content:space-between;align-items:center}
.shimmer{
  background:linear-gradient(90deg,var(--surf) 25%,var(--surf2) 50%,var(--surf) 75%);
  background-size:300% 100%;animation:shim 1.4s infinite;border-radius:12px;height:60px;margin-bottom:8px;
}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<!-- LOADING -->
<div id="ls">
  <div class="ls-ham">🐹</div>
  <div class="ls-bar"><div class="ls-fill"></div></div>
  <p class="ls-txt">লোড হচ্ছে...</p>
</div>

<!-- FLOAT LAYER -->
<div id="float-layer"></div>

<!-- APP -->
<div id="app">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="avatar" id="avatar">🐹</div>
      <div>
        <div class="uname" id="uname">Player</div>
        <div class="ulg" id="ulg">🥉 Bronze</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="pph-lbl">প্রোফিট/ঘণ্টা</div>
      <div class="pph-val">+<span id="pph">0</span> 🪙</div>
    </div>
  </div>

  <!-- Balance -->
  <div class="balance">
    <span class="coin-ico">🪙</span>
    <span class="amount" id="coins">0</span>
  </div>

  <!-- Daily row -->
  <div class="daily-row">
    <button class="daily-btn" onclick="openCheckIn()">
      <span class="d-ico">📅</span>
      <span class="d-lbl">ডেইলি চেক-ইন</span>
      <span class="d-badge" id="ci-badge">●</span>
    </button>
    <button class="daily-btn" onclick="openCombo()">
      <span class="d-ico">🃏</span>
      <span class="d-lbl">ডেইলি কম্বো</span>
      <span class="d-badge" id="combo-badge">0/3</span>
    </button>
    <button class="daily-btn" onclick="openCipher()">
      <span class="d-ico">🔐</span>
      <span class="d-lbl">ডেইলি সাইফার</span>
      <span class="d-badge" id="cipher-badge">●</span>
    </button>
  </div>

  <!-- PAGE 0: HOME -->
  <div class="page active" id="p0">
    <div id="offline-banner"></div>
    <div class="ham-wrap">
      <div class="ham-btn" id="ham-btn">🐹</div>
    </div>
    <div class="energy-wrap">
      <div class="e-row">
        <span><i class="fa-solid fa-bolt" style="color:var(--gold)"></i> এনার্জি</span>
        <span id="e-text">1000 / 1000</span>
      </div>
      <div class="e-bar"><div class="e-fill" id="e-fill" style="width:100%"></div></div>
      <div class="boost-row">
        <button class="boost-btn" id="boost-btn" onclick="useBoost()">
          <i class="fa-solid fa-bolt"></i>
          ফুল এনার্জি <span id="boost-left" style="color:var(--sub);font-size:11px">(3/3)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- PAGE 1: MINE -->
  <div class="page" id="p1">
    <p class="sec-title">মাইনিং আপগ্রেড</p>
    <div class="cat-scroll" id="cat-scroll"></div>
    <div id="upgrades-list"></div>
  </div>

  <!-- PAGE 2: EARN -->
  <div class="page" id="p2">
    <p class="sec-title">আর্ন / টাস্ক</p>
    <div id="tasks-list"></div>
  </div>

  <!-- PAGE 3: RANK -->
  <div class="page" id="p3">
    <p class="sec-title">লিডারবোর্ড</p>
    <div id="lb-list"></div>
  </div>

  <!-- PAGE 4: FRENS -->
  <div class="page" id="p4">
    <p class="sec-title">ফ্রেন্ডস</p>
    <div class="ref-box">
      <p class="r-lbl">প্রতিটি ফ্রেন্ড ইনভাইটে পাও</p>
      <p class="r-amt" id="ref-reward-lbl">+10,000 🪙</p>
      <button class="ref-share" onclick="shareRef()"><i class="fa-solid fa-paper-plane"></i> ইনভাইট লিংক শেয়ার করো</button>
      <button class="ref-copy" onclick="copyRef()"><i class="fa-solid fa-copy"></i> লিংক কপি করো</button>

function today(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return Math.floor(n||0).toLocaleString('en-US'); }
function isYesterday(d){
  if(!d) return false;
  const y = new Date(); y.setDate(y.getDate()-1);
  return d === y.toISOString().slice(0,10);
}
function getLeague(coins){
  let l = CFG.leagues[0];
  for(const x of CFG.leagues){ if(coins >= x.min) l = x; }
  return l;
}
function getCardLevel(id){ return S.upgrades[id]||0; }
function getCardCost(card){
  return Math.round(card.baseCost * Math.pow(card.mult, getCardLevel(card.id)));
}
function recalc(){
  let pph=0, tap=1, maxE=CFG.maxEnergyBase||1000;
  (CFG.upgrades||[]).forEach(c=>{
    const lv = getCardLevel(c.id);
    if(!lv) return;
    if(c.baseProfit) pph += c.baseProfit * lv;
    if(c.tapBoost) tap += c.tapBoost * lv;
    if(c.energyBoost) maxE += c.energyBoost * lv;
  });
  S.profitPerHour = pph;
  S.tapPower = tap;
  S.maxEnergy = maxE;
  if(S.energy > S.maxEnergy) S.energy = S.maxEnergy;
}

  }

  const claimed = S.checkIn.claimedToday;
  const reward = rewards[streak] || rewards[rewards.length-1];

  let items = '';
  rewards.forEach((r,i)=>{
    const done = i < streak || (i===streak && claimed);
    const isActive = i===streak && !claimed;
    items += `<div class="ci-item${isActive?' active':''}${done?' claimed':''}">

function claimCI(){

// UPGRADES
// ======================================================
function renderCats(){
  const el = document.getElementById('cat-scroll');
  el.innerHTML = '';
  (CFG.categories||[]).forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cat-pill' + (activeCat===cat.id?' active':'');
    btn.textContent = `${cat.icon} ${cat.name}`;
    btn.onclick = ()=>{ activeCat=cat.id; renderCats(); renderUpgrades(); };
    el.appendChild(btn);
  });
}

function renderUpgrades(){
  const el = document.getElementById('upgrades-list');
  el.innerHTML = '';
  const cards = (CFG.upgrades||[]).filter(c=>c.cat===activeCat);
  if(!cards.length){ el.innerHTML='<div class="empty"><div class="e-ico">💎</div><p>এই ক্যাটাগরিতে কার্ড নেই</p></div>'; return; }
  cards.forEach(card=>{
    const lv = getCardLevel(card.id);
    const cost = getCardCost(card);
    const canAfford = S.coins >= cost;
    let effect = '';
    if(card.baseProfit) effect = `+${fmt(card.baseProfit)}/ঘণ্টা প্রতি লেভেল`;
    else if(card.energyBoost) effect = `+${card.energyBoost} ম্যাক্স এনার্জি`;
    else if(card.tapBoost) effect = `+${card.tapBoost} ট্যাপ পাওয়ার`;
    const div = document.createElement('div');
    div.className = 'up-card';
    div.innerHTML = `
      <div class="up-ico">${card.icon||'📦'}</div>
      <div class="up-info">
        <div class="up-name">${card.name}</div>
        <div class="up-meta">লেভেল ${lv}</div>
        <div class="up-effect">${effect}</div>
      </div>
      <button class="buy-btn" ${canAfford?'':'disabled'}>${fmt(cost)} 🪙</button>
    `;
    div.querySelector('.buy-btn').onclick = ()=> buyCard(card);
    el.appendChild(div);
  });
}

function buyCard(card){
  const cost = getCardCost(card);
  if(S.coins < cost){ toast('কয়েন কম আছে!','error'); return; }
  S.coins -= cost;
  S.upgrades[card.id] = (S.upgrades[card.id]||0) + 1;
  recalc();
  // track combo
  const td = today();
  if(S.dailyCombo.date !== td) S.dailyCombo = {date:td, upgraded:[], claimed:false};
  if(!(S.dailyCombo.upgraded||[]).includes(card.id)) S.dailyCombo.upgraded.push(card.id);
  renderHeader(); renderEnergy(); renderUpgrades(); updateBadges(); checkAchievements(); saveUser();
  toast(`${card.name} আপগ্রেড হয়েছে! লেভেল ${S.upgrades[card.id]}`);
}

// ======================================================
// TASKS
// ======================================================
function renderTasks(){
  const el = document.getElementById('tasks-list');
  el.innerHTML = '';
  const tasks = CFG.tasks || [];
  if(!tasks.length){ el.innerHTML='<div class="empty"><div class="e-ico">🎯</div><p>কোনো টাস্ক নেই</p></div>'; return; }
  tasks.forEach(task=>{
    const done = (S.tasksCompleted||[]).includes(task.id);
    const div = document.createElement('div');
    div.className = 'task-card';
    div.innerHTML = `
      <div class="task-ico">${task.icon||'🎯'}</div>
      <div class="task-info">
        <div class="task-title">${task.title}</div>
        <div class="task-reward">+${fmt(task.reward)} 🪙</div>
      </div>
      <button class="go-btn${done?' done':''}" ${done?'disabled':''}>${done?'সম্পন্ন ✅':'যাও'}</button>
    `;
    if(!done) div.querySelector('.go-btn').onclick = ()=> startTask(task);
    el.appendChild(div);
  });
}

function startTask(task){
  // Open the link first
  if(task.link){
    if(tg&&tg.openLink) tg.openLink(task.link);
    else window.open(task.link,'_blank');
  }
  showModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">${task.icon||'🎯'} ${task.title}</div>
    <div class="modal-body">
      কাজটি সম্পন্ন করে নিচের বাটনে ক্লিক করো।<br><br>
      <span style="color:var(--gold);font-weight:700">+${fmt(task.reward)} 🪙</span> পাবে!
    </div>
    <button class="modal-ok" onclick="completeTask('${task.id}')">✅ ভেরিফাই করো</button>
    <button class="modal-ok2" onclick="closeModal()">বাতিল</button>
  `);
}

function completeTask(taskId){
  const task = (CFG.tasks||[]).find(t=>t.id===taskId);
  if(!task) return;
  if((S.tasksCompleted||[]).includes(taskId)){ closeModal(); return; }
  S.coins += task.reward;
  if(!S.tasksCompleted) S.tasksCompleted = [];
  S.tasksCompleted.push(taskId);
  renderHeader(); renderTasks(); saveUser(); closeModal();
  toast(`+${fmt(task.reward)} 🪙 পেয়েছো! 🎉`);
}

// ======================================================
// LEADERBOARD
// ======================================================
async function renderLeaderboard(){
  const el = document.getElementById('lb-list');
  el.innerHTML = '<div class="shimmer"></div><div class="shimmer"></div><div class="shimmer"></div>';
  try{
    const snap = await db.collection('users').orderBy('coins','desc').limit(50).get();
    el.innerHTML = '';
    let rank = 0;
    snap.forEach(doc=>{
      const d = doc.data();
      if(d.banned) return;
      rank++;
      const lg = getLeague(d.coins||0);
      const isMe = doc.id === userId;
      const div = document.createElement('div');
      div.className = 'lb-row' + (isMe?' me':'');
      div.innerHTML = `
        <div class="lb-rank" style="color:${rank<=3?'var(--gold)':'var(--sub)'}">${rank<=3?['🥇','🥈','🥉'][rank-1]:rank}</div>
        <div class="lb-info">
          <div class="lb-name">${d.firstName||d.username||'Player'}${isMe?' (তুমি)':''}</div>
          <div class="lb-sub" style="color:${lg.color}">${lg.icon} ${lg.name}</div>
        </div>
        <div class="lb-coins">${fmt(d.coins||0)} 🪙</div>
      `;
      el.appendChild(div);
    });
    if(!rank) el.innerHTML='<div class="empty"><div class="e-ico">🏆</div><p>এখনো কেউ নেই</p></div>';
  }catch(e){
    el.innerHTML='<div class="empty"><div class="e-ico">⚠️</div><p>লোড করতে সমস্যা হয়েছে</p></div>';
  }
}

// ======================================================
// FRENS / REFERRAL
// ======================================================
function getRefLink(){
  const bot = (CFG&&CFG.botUsername) || BOT_USERNAME;
  return `https://t.me/${bot}?start=ref_${userId}`;
}

function shareRef(){
  const link = getRefLink();
  const txt = `🐹 Hamster CEO-তে আমার সাথে জয়েন করো! ফ্রি কয়েন কামাও 👇`;
  const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(txt)}`;
  if(tg&&tg.openTelegramLink) tg.openTelegramLink(url);
  else window.open(url,'_blank');
}

function copyRef(){
  const link = getRefLink();
  if(navigator.clipboard){
    navigator.clipboard.writeText(link).then(()=>toast('লিংক কপি হয়েছে! ✅'));
  } else {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = link; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    toast('লিংক কপি হয়েছে! ✅');
  }
}

function renderFrens(){
  const rr = (CFG&&CFG.referralReward)||10000;
  document.getElementById('ref-reward-lbl').textContent = `+${fmt(rr)} 🪙`;
  document.getElementById('ref-count').textContent = S.referralCount||0;
  const el = document.getElementById('frens-list');
  el.innerHTML = '';
  const refs = S.referrals||[];
  if(!refs.length){ el.innerHTML='<div class="empty"><div class="e-ico">👥</div><p>এখনো কোনো ফ্রেন্ড ইনভাইট করোনি</p></div>'; return; }
  refs.forEach(r=>{
    const div = document.createElement('div');
    div.className = 'fren-row';
    div.innerHTML = `<span class="fren-name">👤 ${r.name||'Friend'}</span><span class="fren-coins">+${fmt(rr)} 🪙</span>`;
    el.appendChild(div);
  });
}

// ======================================================
// ACHIEVEMENTS
// ======================================================
function checkAchievements(){
  let changed = false;
  ACH.forEach(a=>{
    if(a.unlocked) return;
    const val = a.type==='coins' ? S.coins : (S[a.type]||0);
    if(val >= a.max){
      a.unlocked = true;
      S.coins += a.reward;
      changed = true;
      showModal(`
        <div class="modal-handle"></div>
        <div class="modal-title">🏆 এচিভমেন্ট আনলক!</div>
        <div style="text-align:center;font-size:50px;margin-bottom:12px">${a.icon}</div>
        <div style="text-align:center;font-size:16px;font-weight:700;margin-bottom:6px">${a.name}</div>
        <div style="text-align:center;font-size:22px;font-weight:900;color:var(--green);margin-bottom:18px">+${fmt(a.reward)} 🪙</div>
        <button class="modal-ok" onclick="closeModal()">দারুণ! 🎉</button>
      `);
    }
  });
  if(changed){ renderHeader(); renderAch(); saveUser(); }
}

function renderAch(){
  const el = document.getElementById('ach-list');
  el.innerHTML = '';
  ACH.forEach(a=>{
    const val = a.type==='coins' ? S.coins : (S[a.type]||0);
    const pct = Math.min(100, (val/a.max)*100);
    const div = document.createElement('div');
    div.className = 'ach-card' + (a.unlocked?' done':' locked');
    div.innerHTML = `
      <div class="ach-ico">${a.icon}</div>
      <div class="ach-body">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.desc}</div>
        <div class="ach-prog"><div class="ach-fill" style="width:${pct}%"></div></div>
        <div class="ach-pct">${fmt(val)} / ${fmt(a.max)}</div>
      </div>
      <div class="ach-right">
        <div class="ach-reward">+${fmt(a.reward)}</div>
        ${a.unlocked?'<div class="ach-done-ico">✅</div>':''}
      </div>
    `;
    el.appendChild(div);
  });
}

// ======================================================
// OFFLINE EARNINGS BANNER
// ======================================================
function showOfflineBanner(earned){
  const el = document.getElementById('offline-banner');
  el.innerHTML = `
    <div class="offline-popup">
      <div class="op-ico">😴</div>
      <div class="op-txt">অফলাইনে থাকার সময় তোমার ব্যবসা আয় করেছে<br><span class="op-amt">+${fmt(earned)} 🪙</span></div>
      <button class="op-close" onclick="this.parentNode.parentNode.innerHTML=''">✓</button>
    </div>
  `;
}

// ======================================================
// BROADCAST — admin পাঠানো মেসেজ দেখাও
// ======================================================
async function checkBroadcast(){
  try{
    const snap = await db.collection('broadcasts').orderBy('createdAt','desc').limit(1).get();
    if(snap.empty) return;
    const last = snap.docs[0];
    const d = last.data();
    const seenKey = 'hc_bc_' + last.id;
    if(localStorage.getItem(seenKey)) return;
    localStorage.setItem(seenKey,'1');
    showModal(`
      <div class="modal-handle"></div>
      <div class="modal-title">📢 ঘোষণা</div>
      <div class="modal-body">${d.message||''}</div>
      <button class="modal-ok" onclick="closeModal()">ঠিক আছে</button>
    `);
  }catch(e){}
}

// ======================================================
// FIRESTORE: SAVE / LOAD
// ======================================================
function toFS(){
  return {
    username: S.username,
    firstName: S.firstName,
    photoUrl: S.photoUrl||'',
    coins: Math.floor(S.coins),
    energy: Math.floor(S.energy),
    maxEnergy: S.maxEnergy,
    profitPerHour: S.profitPerHour,
    tapPower: S.tapPower,
    upgrades: S.upgrades,
    totalTaps: S.totalTaps,
    referralCount: S.referralCount||0,
    referredBy: S.referredBy||null,
    referrals: S.referrals||[],
    achievements: ACH,
    dailyCombo: S.dailyCombo,
    dailyCipher: S.dailyCipher,
    checkIn: S.checkIn,
    tasksCompleted: S.tasksCompleted||[],
    boostsUsedToday: S.boostsUsedToday||0,
    boostDate: S.boostDate||'',
    banned: S.banned||false,
    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
  };
}

let saveTimer = null;
function saveUser(){
  if(!db||!userId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async()=>{
    try{ await db.collection('users').doc(userId).set(toFS(),{merge:true}); }
    catch(e){ console.error('Save failed',e); }
  }, 800);
}

async function loadConfig(){
  try{
    const doc = await db.collection('config').doc('game').get();
    if(doc.exists){
      CFG = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)), doc.data());
    } else {
      CFG = JSON.parse(JSON.stringify(DEFAULT_CFG));
      await db.collection('config').doc('game').set(CFG);
    }
  }catch(e){ CFG = JSON.parse(JSON.stringify(DEFAULT_CFG)); }
}

async function loadUser(){
  const ref = db.collection('users').doc(userId);
  try{
    const doc = await ref.get();
    if(doc.exists){
      const d = doc.data();
      Object.assign(S, d);
      if(d.achievements) d.achievements.forEach(a=>{ const x=ACH.find(x=>x.id===a.id); if(x&&a.unlocked) x.unlocked=true; });
      // offline earnings
      if(d.lastUpdated && d.lastUpdated.toMillis){
        const hrs = Math.min((Date.now()-d.lastUpdated.toMillis())/3600000, CFG.offlineEarningCapHours||3);
        if(hrs>0.02 && S.profitPerHour>0){
          const earned = Math.floor(S.profitPerHour * hrs);
          if(earned>0){ S.coins+=earned; setTimeout(()=>showOfflineBanner(earned),800); }
        }
      }
    } else {
      // NEW USER
      const sp = tg?.initDataUnsafe?.start_param || '';
      if(sp.startsWith('ref_')){
        const refId = sp.replace('ref_','');
        if(refId && refId!==userId){
          S.referredBy = refId;
          S.coins += (CFG.referralReward||10000);
          creditReferrer(refId);
        }
      }
      S.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await ref.set(toFS());
    }
  }catch(e){ console.error('Load user failed',e); }
}

async function creditReferrer(refId){
  try{
    const ref = db.collection('users').doc(refId);
    await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      if(!snap.exists) return;
      const d = snap.data();
      const refs = d.referrals||[];
      refs.push({id:userId, name:S.firstName||S.username, joinedAt:Date.now()});
      tx.update(ref,{
        coins:(d.coins||0)+(CFG.referralReward||10000),
        referralCount:(d.referralCount||0)+1,
        referrals:refs
      });
    });
  }catch(e){ console.error('Credit referrer failed',e); }
}

// ======================================================
// GAME LOOPS
// ======================================================
// Energy regen
setInterval(()=>{
  if(S.energy < S.maxEnergy){
    S.energy = Math.min(S.maxEnergy, S.energy + (CFG.energyRegenPerTick||3));
    if(currentPage===0) renderEnergy();
  }
}, CFG?.energyRegenIntervalMs||1000);

// Passive profit
setInterval(()=>{
  if(S.profitPerHour>0){
    S.coins += S.profitPerHour/3600;
    if(currentPage===0||currentPage===1) renderHeader();
    checkAchievements();
  }
},1000);

// Auto-save every 15s
setInterval(saveUser, 15000);

// ======================================================
// INIT
// ======================================================
window.onload = async()=>{
  try{
    tg = window.Telegram?.WebApp;
    if(tg){ tg.ready(); tg.expand(); tg.setHeaderColor('#0a0b0f'); }

    const u = tg?.initDataUnsafe?.user;
    if(u){
      userId = u.id.toString();
      S.username = u.username||u.first_name||'player';
      S.firstName = u.first_name||S.username;
      S.photoUrl = u.photo_url||'';
    } else {
      // browser test mode
      userId = 'test_' + Math.floor(Math.random()*99999);
      S.username = 'TestPlayer';
      S.firstName = 'Test Player';
    }

    firebase.initializeApp(FB_CFG);
    db = firebase.firestore();

    await loadConfig();
    await loadUser();
    recalc();

    if(S.banned){
      document.getElementById('ls').innerHTML=`
        <div style="font-size:56px">🚫</div>
        <p style="color:var(--red);font-weight:700;margin-top:16px">অ্যাকাউন্ট ব্লক করা হয়েছে</p>
        <p style="color:var(--sub);font-size:12px;margin-top:8px">সাহায্যের জন্য সাপোর্টে যোগাযোগ করো।</p>
      `;
      return;
    }

    renderHeader();
    renderEnergy();
    updateBadges();
    showPage(0);
    setTimeout(checkBroadcast, 1500);

    document.getElementById('ls').style.display='none';
    document.getElementById('app').style.display='block';

  }catch(e){
    console.error('Init error',e);
    document.getElementById('ls').innerHTML=`
      <div style="font-size:56px">⚠️</div>
      <p style="color:var(--red);font-weight:700;margin-top:16px">লোড হয়নি</p>
      <p style="color:var(--sub);font-size:11px;margin-top:8px;padding:0 24px;text-align:center">${e.message||e}</p>
    `;
  }
};

window.addEventListener('beforeunload',()=>saveUser());
</script>
